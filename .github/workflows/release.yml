# SCRATCH COPY for v49 verification; never merged.
name: Release (scratch)
'on':
  workflow_call:
    inputs:
      commit:
        description: The exact commit to release (the caller's tested push commit)
        required: true
        type: string
    outputs:
      tag:
        description: The release tag (vX.Y.Z)
        value: ${{ jobs.release.outputs.tag }}
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  release:
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - name: Check out the commit to release
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.commit || 'main' }}
        fetch-depth: 0
    - name: Resolve version
      id: version
      run: |
        VERSION="$(python3 .github/scripts/check_version.py)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
        echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Check whether this version was already released
      id: tag-check
      run: |
        TAG="${{ steps.version.outputs.tag }}"
        if git ls-remote --tags origin "refs/tags/scratch-$TAG" | grep -q .; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
        NEWEST="$( { git ls-remote --tags --refs origin 'refs/tags/scratch-v*' | sed 's|.*refs/tags/scratch-||'; echo "$TAG"; } \
          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
        if [ "$NEWEST" = "$TAG" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi
    - name: Build deploy bundle
      if: steps.tag-check.outputs.exists == 'false'
      run: |
        BUNDLE="spotdl-web-${{ steps.version.outputs.version }}-deploy.tar.gz"
        tar czf "$BUNDLE" \
          docker-compose.yml docker-compose.prod.yml \
          .env.example proxies.txt.example scripts/
        echo "BUNDLE_PATH=$BUNDLE" >> "$GITHUB_ENV"
    - name: Copy backend requirements.txt
      if: steps.tag-check.outputs.exists == 'false'
      run: cp backend/requirements.txt "requirements-${{ steps.version.outputs.version }}.txt"
    - name: Create GitHub release
      if: steps.tag-check.outputs.exists == 'false'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "STUB gh release create ${{ steps.version.outputs.tag }} --target ${{ steps.version.outputs.commit }} --latest=${{ steps.tag-check.outputs.latest }} (inputs.commit=${{ inputs.commit }})"
        git tag "scratch-${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.commit }}"
        git push origin "scratch-${{ steps.version.outputs.tag }}"
    - name: Summary
      run: |
        {
          echo "## Release ${{ steps.version.outputs.tag }}"
          if [ "${{ steps.tag-check.outputs.exists }}" = "true" ]; then
            echo "Already released -- skipped (no version bump since the last release)."
          else
            echo "Created with deploy bundle + requirements.txt. \`images.json\` follows from Publish & Deploy."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
