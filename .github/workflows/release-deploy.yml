name: Release & Deploy

# v49: everything a push to `main` sets off, in one run (see docs/RELEASE_PIPELINE.md, "The
# chain"): the checks, then the release when the version has no tag yet, then the deploy of that
# release, then one Matrix notice. Each stage is a job of this run, calling the workflow that
# does the work (`workflow_call`), so `needs:` orders them and the default GITHUB_TOKEN is enough.
#
# This replaces a chain of workflow-completion triggers (CI, then Release, then Publish &
# Deploy). Those fired on *every* completion of the workflow before them, PRs and the schedule
# included, and left a run behind that only skipped itself; a skipped run completes too, so the
# next link fired as well. Here a merge that changes nothing releasable is still one run: the
# checks pass, and `release`/`deploy` show as skipped jobs inside it. No other run is created.
#
# Nothing cancels: no `concurrency` group here or in the called workflows. A second merge's run
# queues behind the first on the one self-hosted runner; it never cancels it mid-release. The
# deploy job's version guard covers an older run finishing after a newer one.
#
# `workflow_dispatch` re-runs the whole chain on `main`. With the version already released, that
# is the checks only, unless `redeploy` is set (the owner's lever, v49): then it deploys the
# current version's release again in release mode. That puts a release back after a `manual-*`
# dispatch. The workflow files and the deploy's `.pipeline` scripts (check_required_env.py,
# migration_guard.sh, redact_env.py) come from `main`'s head; everything the deploy checks out
# (compose files, wait_for_stack_health.sh) is the tag's, so a fix there still needs a bump.
# Re-run a failed run's *failed* jobs to retry its release or deploy: "Re-run all jobs" re-runs
# `plan`, which then finds the tag and deploys nothing.
"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      redeploy:
        description: "Version already released: deploy that release again (release mode)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  # Reads the version at this commit and decides whether its tag still has to be cut, or (a
  # `redeploy` dispatch) whether its release is deployed again. Kept small: v61 adds an
  # `extension` output beside `release`.
  plan:
    needs: checks
    runs-on: self-hosted
    outputs:
      release: ${{ steps.plan.outputs.release }}
      redeploy: ${{ steps.plan.outputs.redeploy }}
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # Only `main` is ever released: a dispatch from another branch ("Use workflow from") would
      # otherwise tag, publish `latest` and persist-deploy an unmerged commit, and the real merge
      # of that version would then find its tag taken. Fails loudly rather than skipping.
      # Tags are read from the remote (a fresh checkout has none locally), in an assignment of
      # their own: under `bash -e` without pipefail, a failed `ls-remote | grep` would read as
      # "no tag yet".
      - name: Decide what to release
        id: plan
        env:
          REDEPLOY: ${{ inputs.redeploy }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release & Deploy releases main only (this run is on $GITHUB_REF). To try a branch on the host, dispatch Publish & Deploy with -f ref=<branch>."
            exit 1
          fi
          VERSION="$(python3 .github/scripts/check_version.py)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # `--tags`: patterns match ref-name tails, so without it a branch named
          # `x/refs/tags/vX` would pass for the tag.
          REMOTE="$(git ls-remote --tags origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}")"
          if [ -z "$REMOTE" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION has no tag yet: releasing it." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$REDEPLOY" = "true" ]; then
            # The release's own commit, so the deploy keeps tag and commit together. An annotated
            # tag's `^{}` line names its commit; a lightweight tag's own line does. Exact names:
            # patterns match ref-name tails, so `refs/tags/x/refs/tags/vX` would match too.
            COMMIT="$(printf '%s\n' "$REMOTE" | awk -v r="refs/tags/v$VERSION" \
              '$2 == r "^{}" {p = $1} $2 == r {l = $1} END {print (p != "" ? p : l)}')"
            if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Couldn't resolve v$VERSION's commit for the redeploy (got '$COMMIT')."
              exit 1
            fi
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "redeploy=true" >> "$GITHUB_OUTPUT"
            echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released: deploying its commit $COMMIT again (redeploy)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released: nothing to release or deploy." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      commit: ${{ github.sha }}
    secrets: inherit

  # After a release in this same run, and only when that tag is this run's commit (`owned`, see
  # release.yml); or, for a `redeploy` dispatch, the existing release's commit. Skipped
  # otherwise. Release mode: persists the new IMAGE_TAG and `.last-good`, exactly as the old
  # merge-driven path did. `!cancelled()` (not `always()`) only so a skipped `release` (the
  # redeploy case) doesn't skip it, while a cancelled run still stops it; the plan must have
  # succeeded either way.
  deploy:
    needs: [plan, release]
    if: >-
      !cancelled() && needs.plan.result == 'success' && (
        (needs.release.result == 'success' && needs.release.outputs.owned == 'true') ||
        (needs.release.result == 'skipped' && needs.plan.outputs.redeploy == 'true')
      )
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-deploy.yml
    with:
      commit: ${{ needs.plan.outputs.redeploy == 'true' && needs.plan.outputs.commit || github.sha }}
      release_tag: ${{ needs.release.outputs.tag || needs.plan.outputs.tag }}
    secrets: inherit

  # One notice for the whole run: any failed or cancelled job, named, and every real deploy
  # (release mode, not idempotency-skipped or stale) that succeeded, so silence means "nothing
  # happened", never "maybe it failed" (v33). One `run:` step, no `uses:` (no checkout): a
  # GitHub-side failure on an action download (v48's 429, which took 4.40.2's deploy and its
  # notice down together) can't stop this job, since it downloads nothing.
  notify:
    needs: [checks, plan, release, deploy]
    runs-on: self-hosted
    if: >-
      always() && (
        contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
        (needs.deploy.result == 'success' && needs.deploy.outputs.skipped != 'true')
      )
    steps:
      - name: Send the Matrix notification
        env:
          MATRIX_HOMESERVER_URL: ${{ secrets.MATRIX_HOMESERVER_URL }}
          MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          MATRIX_ROOM_ID: ${{ secrets.MATRIX_ROOM_ID }}
          MATRIX_TXN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          FAILED_CHECKS: ${{ needs.checks.outputs.failed }}
          PLAN_RESULT: ${{ needs.plan.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          TAG: ${{ needs.release.outputs.tag || needs.plan.outputs.tag }}
          VERSION: ${{ needs.deploy.outputs.version || needs.plan.outputs.version }}
          DEPLOY_VERSION: ${{ needs.deploy.outputs.version }}
          PUBLISHED: ${{ needs.deploy.outputs.published }}
          ROLLBACK_NOTE: ${{ needs.deploy.outputs.rollback_note }}
        run: |
          failed=""
          for pair in "checks=$CHECKS_RESULT" "plan=$PLAN_RESULT" "release=$RELEASE_RESULT" "deploy=$DEPLOY_RESULT"; do
            case "${pair#*=}" in failure|cancelled) failed="$failed ${pair%%=*} (${pair#*=})" ;; esac
          done
          # Name the check itself (ci.yml's `failed` output), e.g. "checks: pytest (failure)".
          if [ -n "$FAILED_CHECKS" ]; then failed="${failed/checks (/checks: $FAILED_CHECKS (}"; fi
          release="${TAG:-unresolved} (version ${VERSION:-unresolved})"

          if [ -z "$failed" ]; then
            {
              echo "✅ spotdl-web deployed ${VERSION} to production"
              echo "Workflow: $WORKFLOW"
              echo "Release: $release"
              echo "Run: $RUN_URL"
            } > "$RUNNER_TEMP/message.txt"
          else
            if [ -n "$ROLLBACK_NOTE" ]; then
              rollback="$ROLLBACK_NOTE"
            elif [ "$DEPLOY_RESULT" = "skipped" ]; then
              # The checks, the plan or the release failed: the deploy never started.
              rollback="not needed, nothing was deployed"
            elif [ -z "$DEPLOY_VERSION" ]; then
              # resolve didn't finish (a failed called workflow still returns its outputs, so
              # an empty version means exactly that): publish and deploy never started.
              rollback="not needed, resolve didn't finish, so nothing was built or deployed"
            elif [ "$PUBLISHED" != "true" ]; then
              # The deploy's outputs did come back (resolve's version), without publish's: the
              # publish job didn't finish (images may be partly pushed), so the host job never ran.
              rollback="not needed, publish didn't finish, so the host deploy never started"
            else
              # Published, but no note at all: the deploy job never reported (runner died, host
              # rebooted, or GitHub failed it at "Set up job"). Don't guess.
              rollback="UNKNOWN, the deploy job reported nothing. Check the host"
            fi
            {
              echo "❌ spotdl-web: $WORKFLOW failed"
              echo "Failed job(s):$failed"
              echo "Release: $release"
              echo "Rollback: $rollback"
              echo "Run: $RUN_URL"
            } > "$RUNNER_TEMP/message.txt"
          fi
          cat "$RUNNER_TEMP/message.txt"

          # Matrix sender, kept identical in nightly.yml, release-deploy.yml and publish-deploy.yml
          # (no checkout, so no shared script). PUT {homeserver}/_matrix/client/v3/rooms/{room}/
          # send/m.room.message/{txn}: the txn makes a retried request idempotent, and a re-run
          # (a new attempt) posts again, on purpose. Unconfigured (a secret empty) means alerts
          # are off, and a failed send is only a warning (v33.1): neither turns a run red. The URL
          # and the token reach curl on stdin (`--config -`), never its command line, and nothing
          # prints them; `-s` without `-S`, since curl's error text names the host. Cloudflare in
          # front of Synapse refuses a request without an explicit User-Agent (v33).
          # Whitespace trimmed (a secret pasted with a newline breaks curl's config file), and a
          # whitespace-only value counts as unset. `tr` reads the token on stdin, not argv.
          homeserver="$(printf '%s' "$MATRIX_HOMESERVER_URL" | tr -d '[:space:]')"
          homeserver="${homeserver%/}"
          token="$(printf '%s' "$MATRIX_ACCESS_TOKEN" | tr -d '[:space:]')"
          room="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["MATRIX_ROOM_ID"].strip(), safe=""))')"
          if [ -z "$homeserver" ] || [ -z "$token" ] || [ -z "$room" ]; then
            echo "::warning::Matrix notification skipped: MATRIX_* not configured (repository secrets; see docs/DEPLOYMENT.md, 'Matrix alert bot')."
            exit 0
          fi
          python3 -c 'import json, sys; print(json.dumps({"msgtype": "m.text", "body": sys.stdin.read().strip()}))' \
            < "$RUNNER_TEMP/message.txt" > "$RUNNER_TEMP/matrix.json"
          code="$(printf 'url = "%s/_matrix/client/v3/rooms/%s/send/m.room.message/%s"\nheader = "Authorization: Bearer %s"\n' \
              "$homeserver" "$room" "$MATRIX_TXN_ID" "$token" \
            | curl -s --config - -X PUT --max-time 30 \
                -H 'Content-Type: application/json' -A 'spotdl-web-pipeline/1 (+https://github.com/vb2007/spotdl-web)' \
                --data-binary "@$RUNNER_TEMP/matrix.json" -o "$RUNNER_TEMP/matrix.out" -w '%{http_code}')" || true
          case "$code" in
            2??) echo "Matrix notification sent (HTTP $code)" ;;
            ""|000) echo "::warning::Matrix notification failed: no response (connection error or timeout)" ;;
            # Matrix error bodies are {"errcode", "error"}: the errcode is safe and the only useful part.
            *) echo "::warning::Matrix notification failed: HTTP $code $(grep -o '"errcode": *"[A-Z_]*"' "$RUNNER_TEMP/matrix.out" | head -n1)" ;;
          esac
