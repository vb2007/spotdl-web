# SCRATCH COPY for v49 verification; never merged.
name: Publish & Deploy (scratch)
'on':
  workflow_call:
    inputs:
      commit:
        description: The exact commit to publish and deploy (the release's commit)
        required: true
        type: string
      release_tag:
        description: The release tag the caller's release job cut for it (vX.Y.Z)
        required: true
        type: string
    outputs:
      version:
        value: ${{ jobs.resolve.outputs.version }}
      published:
        value: ${{ jobs.publish.outputs.done }}
      skipped:
        value: ${{ jobs.deploy.outputs.skipped }}
      rollback_note:
        value: ${{ jobs.deploy.outputs.rollback_note }}
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build and deploy
        required: true
        default: main
permissions:
  contents: write
  packages: write
env:
  BACKEND_IMAGE: ghcr.io/vb2007/spotdl-web-backend
  FRONTEND_IMAGE: ghcr.io/vb2007/spotdl-web-frontend
jobs:
  resolve:
    runs-on: self-hosted
    outputs:
      commit: ${{ steps.info.outputs.commit }}
      version: ${{ steps.info.outputs.version }}
      image_tags: ${{ steps.info.outputs.image_tags }}
      persist: ${{ steps.info.outputs.persist }}
      release_tag: ${{ steps.info.outputs.release_tag }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.commit || inputs.ref }}
        fetch-depth: 0
    - name: Compute version, image tags, and persistence mode
      id: info
      env:
        RELEASE_COMMIT: ${{ inputs.commit }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        COMMIT="$(git rev-parse HEAD)"
        echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
        if [ -z "$RELEASE_COMMIT" ]; then
          VERSION="manual-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tags=$VERSION" >> "$GITHUB_OUTPUT"
          echo "persist=false" >> "$GITHUB_OUTPUT"
        else
          VERSION="$(python3 .github/scripts/check_version.py)"
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG doesn't match version $VERSION at $COMMIT."
            exit 1
          fi
          NEWEST="$( { git ls-remote --tags --refs origin 'refs/tags/scratch-v*' | sed 's|.*refs/tags/scratch-||'; echo "$RELEASE_TAG"; } \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          if [ "$NEWEST" = "$RELEASE_TAG" ]; then
            echo "image_tags=$VERSION,latest" >> "$GITHUB_OUTPUT"
          else
            echo "image_tags=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Not tagging latest: $NEWEST is newer than $RELEASE_TAG."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "persist=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        fi
  publish:
    needs: resolve
    runs-on: self-hosted
    outputs:
      done: ${{ steps.done.outputs.done }}
    steps:
    - name: STUB publish
      run: |
        echo "STUB docker build + push: commit=${{ needs.resolve.outputs.commit }} tags=${{ needs.resolve.outputs.image_tags }} version=${{ needs.resolve.outputs.version }} persist=${{ needs.resolve.outputs.persist }} release_tag=${{ needs.resolve.outputs.release_tag }}"
    - name: Mark the images published
      id: done
      run: |
        echo "done=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs:
    - resolve
    - publish
    runs-on: self-hosted
    timeout-minutes: 40
    env:
      DEPLOY_DIR: /tmp/spotdl-web-ci-chain-scratch
    outputs:
      skipped: ${{ steps.skip.outputs.skip || 'false' }}
      rollback_note: ${{ steps.note.outputs.note }}
      deploy_step: ${{ steps.deploy.outcome }}
      health: ${{ steps.health.outcome }}
      rollback: ${{ steps.rollback.outputs.result }}
      rollback_tag: ${{ steps.rollback.outputs.target || steps.prev.outputs.tag }}
      rollback_fallback: ${{ steps.rollback.outputs.fallback }}
      rollback_detail: ${{ steps.rollback.outputs.detail }}
      backup_path: ${{ steps.backup.outputs.path }}
    steps:
    - name: Use a job-private Docker config
      run: |
        DIR="$RUNNER_TEMP/docker-config"
        SHARED="${DOCKER_CONFIG:-$HOME/.docker}"
        rm -rf "$DIR" && mkdir -p "$DIR"
        if [ -f "$SHARED/config.json" ]; then
          python3 -c 'import json, sys
        c = json.load(open(sys.argv[1]))
        for k in ("auths", "credsStore", "credHelpers"):
            c.pop(k, None)
        json.dump(c, open(sys.argv[2], "w"))' "$SHARED/config.json" "$DIR/config.json"
        fi
        # Plugins (buildx, compose) and contexts are found only under DOCKER_CONFIG or the
        # system plugin dirs, so the user-level ones are linked in, read-only in practice.
        for d in cli-plugins contexts; do
          if [ -e "$SHARED/$d" ]; then ln -s "$SHARED/$d" "$DIR/$d"; fi
        done
        echo "DOCKER_CONFIG=$DIR" >> "$GITHUB_ENV"
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve.outputs.commit }}
    - name: Check out the pipeline's own scripts
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        path: .pipeline
        sparse-checkout: .github/scripts
    - name: Preflight
      run: |
        mkdir -p "$DEPLOY_DIR"; echo "STUB preflight of $DEPLOY_DIR"
    - name: Record the current deployment and the rollback target
      id: prev
      run: |
        CURRENT_TAG="$(grep -E '^IMAGE_TAG=' "$DEPLOY_DIR/.env" 2>/dev/null | tail -n1 | cut -d= -f2- || true)"
        echo "current_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
        echo "current_commit=stub" >> "$GITHUB_OUTPUT"
        echo "current_healthy=true" >> "$GITHUB_OUTPUT"
        TAG="$(grep -E '^IMAGE_TAG=' "$DEPLOY_DIR/.last-good" 2>/dev/null | tail -n1 | cut -d= -f2- || true)"
        echo "tag=${TAG:-$CURRENT_TAG}" >> "$GITHUB_OUTPUT"
        echo "commit=stub" >> "$GITHUB_OUTPUT"
        echo "STUB record: IMAGE_TAG=${CURRENT_TAG:-(none)} .last-good=${TAG:-(none)}"
    - name: Skip a release older than the production baseline
      id: stale
      if: needs.resolve.outputs.persist == 'true'
      env:
        VERSION: ${{ needs.resolve.outputs.version }}
      run: |
        BASELINE=""
        if [ -f "$DEPLOY_DIR/.last-good" ]; then
          BASELINE="$(grep -E '^IMAGE_TAG=' "$DEPLOY_DIR/.last-good" | tail -n1 | cut -d= -f2- || true)"
        fi
        if printf '%s\n' "$BASELINE" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' \
           && [ "$VERSION" != "$BASELINE" ] \
           && [ "$(printf '%s\n%s\n' "$VERSION" "$BASELINE" | sort -V | head -n1)" = "$VERSION" ]; then
          echo "stale=true" >> "$GITHUB_OUTPUT"
          echo "Not deployed: $VERSION is older than the production baseline $BASELINE (.last-good), so this run is a no-op." \
            | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "stale=false" >> "$GITHUB_OUTPUT"
          echo "Production baseline: ${BASELINE:-(none)}; deploying $VERSION."
        fi
    - name: Preflight required variables against the host .env
      if: steps.stale.outputs.stale != 'true'
      env:
        COMMIT: ${{ needs.resolve.outputs.commit }}
      run: |
        echo "STUB required-variable preflight for ${{ needs.resolve.outputs.commit }}"
    - name: Skip if this version is already deployed and healthy
      id: skip
      if: needs.resolve.outputs.persist == 'true'
      run: |
        if [ "${{ steps.stale.outputs.stale }}" = "true" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        elif [ "${{ steps.prev.outputs.current_tag }}" = "${{ needs.resolve.outputs.version }}" ] \
           && true; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Back up Postgres before migrating
      id: backup
      if: steps.skip.outputs.skip != 'true'
      run: |
        echo "STUB pg_backup"; echo "path=/stub/backup.sql.gz" >> "$GITHUB_OUTPUT"
    - name: Update the deploy checkout and bring the stack up
      id: deploy
      if: steps.skip.outputs.skip != 'true'
      run: |
        echo "STUB deploy: commit=${{ needs.resolve.outputs.commit }} version=${{ needs.resolve.outputs.version }} persist=${{ needs.resolve.outputs.persist }}"
        echo "$(date -u +%FT%TZ) run=${{ github.run_id }} deployed ${{ needs.resolve.outputs.version }} (${{ needs.resolve.outputs.commit }})" >> "$DEPLOY_DIR/deploys.log"
        printf 'IMAGE_TAG=%s\n' "${{ needs.resolve.outputs.version }}" > "$DEPLOY_DIR/.env"
    - name: Wait for the stack to become healthy
      id: health
      if: steps.skip.outputs.skip != 'true'
      run: |
        if [ -f .scratch-fail-health ]; then echo "STUB health gate: failing on purpose (.scratch-fail-health)"; exit 1; fi
        echo "STUB health gate: healthy"
    - name: Roll back to the previous commit and image on failure
      id: rollback
      if: |-
        (failure() || cancelled()) && steps.health.outcome != 'success' && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure' ||
         steps.deploy.outcome == 'cancelled')
      env:
        PREV_TAG: ${{ steps.prev.outputs.tag }}
        PREV_COMMIT: ${{ steps.prev.outputs.commit }}
        CUR_TAG: ${{ steps.prev.outputs.current_tag }}
        CUR_COMMIT: ${{ steps.prev.outputs.current_commit }}
        CUR_HEALTHY: ${{ steps.prev.outputs.current_healthy }}
        NEW_TAG: ${{ needs.resolve.outputs.version }}
        BACKUP_PATH: ${{ steps.backup.outputs.path }}
      run: |
        echo "STUB rollback to IMAGE_TAG=$PREV_TAG"
        echo "result=succeeded" >> "$GITHUB_OUTPUT"
        echo "fallback=false" >> "$GITHUB_OUTPUT"
        echo "target=$PREV_TAG" >> "$GITHUB_OUTPUT"
        exit 1
    - name: Record last-known-good
      if: success() && needs.resolve.outputs.persist == 'true' && steps.stale.outputs.stale != 'true'
      env:
        COMMIT: ${{ needs.resolve.outputs.commit }}
      run: |
        printf 'IMAGE_TAG=%s\nCOMMIT=%s\n' "${{ needs.resolve.outputs.version }}" "$COMMIT" > "$DEPLOY_DIR/.last-good"
        echo "Wrote $DEPLOY_DIR/.last-good (stub):"; cat "$DEPLOY_DIR/.last-good"
    - name: Prune old images and build cache
      if: steps.skip.outputs.skip != 'true' && success()
      run: |
        echo "STUB prune"
    - name: Describe the rollback for the notice
      id: note
      if: always()
      env:
        ROLLBACK: ${{ steps.rollback.outputs.result }}
        ROLLBACK_TAG: ${{ steps.rollback.outputs.target || steps.prev.outputs.tag }}
        ROLLBACK_FALLBACK: ${{ steps.rollback.outputs.fallback }}
        ROLLBACK_DETAIL: ${{ steps.rollback.outputs.detail }}
        BACKUP_PATH: ${{ steps.backup.outputs.path }}
        DEPLOY_STEP: ${{ steps.deploy.outcome }}
        HEALTH: ${{ steps.health.outcome }}
      run: |
        case "$ROLLBACK" in
          succeeded)
            if [ "$ROLLBACK_FALLBACK" = "true" ]; then
              rollback="succeeded, back on ${ROLLBACK_TAG}: the pre-deploy version, since the database is ahead of .last-good"
            else
              rollback="succeeded, back on ${ROLLBACK_TAG}"
            fi
            ;;
          refused)
            if [ -n "$ROLLBACK_DETAIL" ]; then
              # The detail changes the right recovery (the backup may be ahead of
              # .last-good too), so point at the docs rather than give generic advice.
              rollback="REFUSED: the database is ahead of ${ROLLBACK_TAG}${ROLLBACK_DETAIL}. Recovery depends on that detail: docs/DEPLOYMENT.md, 'The database is ahead of the rollback image'. Pre-deploy pg_backup: ${BACKUP_PATH:-path in the run log}"
            else
              rollback="REFUSED: the database is ahead of ${ROLLBACK_TAG}. Restore the pre-deploy pg_backup (${BACKUP_PATH:-path in the run log}) or roll forward"
            fi
            ;;
          guard-error) rollback="NOT STARTED: the migration guard couldn't compare revisions, so the old stack was left alone. See the run log" ;;
          not-started) rollback="NOT STARTED: the rollback stopped before moving anything (see the run log); the failed deploy is still in place" ;;
          failed)
            # if/else, not `$([ … ] && echo …)`: under -e a false test in a substitution
            # fails the whole assignment, and the message would never be sent.
            if [ "$ROLLBACK_FALLBACK" = "true" ]; then
              rollback="FAILED rolling back to ${ROLLBACK_TAG} (the pre-deploy version), the stack may be down"
            else
              rollback="FAILED rolling back to ${ROLLBACK_TAG}, the stack may be down"
            fi
            ;;
          *)
            if [ "$DEPLOY_STEP" = "success" ] && [ "$HEALTH" = "success" ]; then
              rollback="not needed, the new version passed its health gate (a later step failed, see the run)"
            elif [ "$DEPLOY_STEP" = "success" ] || [ "$DEPLOY_STEP" = "failure" ] || [ "$DEPLOY_STEP" = "cancelled" ]; then
              rollback="not attempted, the host may be mid-deploy"
            else
              rollback="not needed, nothing on the host was changed"
            fi
            ;;
        esac
        echo "note=$rollback" >> "$GITHUB_OUTPUT"
    - name: Summary
      if: always()
      run: |
        { echo "## Deploy (scratch stub)"; echo "- version: ${{ needs.resolve.outputs.version }}"; echo "- mode: ${{ needs.resolve.outputs.persist == 'true' && 'release' || 'manual dispatch' }}"; echo "- skipped: ${{ steps.skip.outputs.skip || 'false' }}"; echo "- stale: ${{ steps.stale.outputs.stale || 'n/a' }}"; echo "- .env: $(cat "$DEPLOY_DIR/.env" 2>/dev/null)"; echo "- .last-good: $(tr '\n' ' ' < "$DEPLOY_DIR/.last-good" 2>/dev/null)"; echo "- deploys.log:"; echo '```'; cat "$DEPLOY_DIR/deploys.log" 2>/dev/null; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
  notify:
    needs:
    - resolve
    - publish
    - deploy
    runs-on: self-hosted
    if: always() && !inputs.commit && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    steps:
    - name: Send the Matrix notification
      env:
        MATRIX_HOMESERVER_URL: ${{ secrets.MATRIX_HOMESERVER_URL }}
        MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
        MATRIX_ROOM_ID: ${{ vars.SCRATCH_MATRIX_ROOM_ID }}
        MATRIX_TXN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        WORKFLOW: ${{ github.workflow }}
        RESOLVE_RESULT: ${{ needs.resolve.result }}
        PUBLISH_RESULT: ${{ needs.publish.result }}
        DEPLOY_RESULT: ${{ needs.deploy.result }}
        VERSION: ${{ needs.resolve.outputs.version }}
        ROLLBACK_NOTE: ${{ needs.deploy.outputs.rollback_note }}
      run: |
        failed=""
        for pair in "resolve=$RESOLVE_RESULT" "publish=$PUBLISH_RESULT" "deploy=$DEPLOY_RESULT"; do
          case "${pair#*=}" in failure|cancelled) failed="$failed ${pair%%=*} (${pair#*=})" ;; esac
        done
        if [ -n "$ROLLBACK_NOTE" ]; then
          rollback="$ROLLBACK_NOTE"
        elif [ "$DEPLOY_RESULT" = "skipped" ]; then
          rollback="not needed, nothing on the host was changed"
        else
          # No note at all: the deploy job never reported (runner died, host rebooted, or
          # GitHub failed it at "Set up job"). Don't guess.
          rollback="UNKNOWN, the deploy job reported nothing. Check the host"
        fi
        {
          echo "❌ spotdl-web: $WORKFLOW failed"
          echo "Failed job(s):$failed"
          echo "Release: none (version ${VERSION:-unresolved}, manual dispatch)"
          echo "Rollback: $rollback"
          echo "Run: $RUN_URL"
        } > "$RUNNER_TEMP/message.txt"
        cat "$RUNNER_TEMP/message.txt"

        # Matrix sender, kept identical in nightly.yml, release-deploy.yml and publish-deploy.yml
        # (no checkout, so no shared script). PUT {homeserver}/_matrix/client/v3/rooms/{room}/
        # send/m.room.message/{txn}: the txn makes a retried request idempotent, and a re-run
        # (a new attempt) posts again, on purpose. Unconfigured (a secret empty) means alerts
        # are off, and a failed send is only a warning (v33.1): neither turns a run red. The URL
        # and the token reach curl on stdin (`--config -`), never its command line, and nothing
        # prints them; `-s` without `-S`, since curl's error text names the host. Cloudflare in
        # front of Synapse refuses a request without an explicit User-Agent (v33).
        if [ -z "$MATRIX_HOMESERVER_URL" ] || [ -z "$MATRIX_ACCESS_TOKEN" ] || [ -z "$MATRIX_ROOM_ID" ]; then
          echo "::warning::Matrix notification skipped: MATRIX_* not configured (repository secrets; see docs/DEPLOYMENT.md, 'Matrix alert bot')."
          exit 0
        fi
        room="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["MATRIX_ROOM_ID"].strip(), safe=""))')"
        python3 -c 'import json, sys; print(json.dumps({"msgtype": "m.text", "body": sys.stdin.read().strip()}))' \
          < "$RUNNER_TEMP/message.txt" > "$RUNNER_TEMP/matrix.json"
        code="$(printf 'url = "%s/_matrix/client/v3/rooms/%s/send/m.room.message/%s"\nheader = "Authorization: Bearer %s"\n' \
            "${MATRIX_HOMESERVER_URL%/}" "$room" "$MATRIX_TXN_ID" "$MATRIX_ACCESS_TOKEN" \
          | curl -s --config - -X PUT --max-time 30 \
              -H 'Content-Type: application/json' -A 'spotdl-web-pipeline/1 (+https://github.com/vb2007/spotdl-web)' \
              --data-binary "@$RUNNER_TEMP/matrix.json" -o "$RUNNER_TEMP/matrix.out" -w '%{http_code}')" || true
        case "$code" in
          2??) echo "Matrix notification sent (HTTP $code)" ;;
          ""|000) echo "::warning::Matrix notification failed: no response (connection error or timeout)" ;;
          # Matrix error bodies are {"errcode", "error"}: the errcode is safe and the only useful part.
          *) echo "::warning::Matrix notification failed: HTTP $code $(grep -o '"errcode": *"[A-Z_]*"' "$RUNNER_TEMP/matrix.out" | head -n1)" ;;
        esac
