# SCRATCH COPY for v49 verification; never merged.
name: CI (scratch)
'on':
  pull_request:
    branches:
    - ci-chain-scratch
  workflow_dispatch: null
  workflow_call:
    outputs:
      failed:
        description: The checks that failed or were cancelled, space-separated (empty when all passed)
        value: ${{ jobs.summary.outputs.failed }}
jobs:
  version:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Check backend/frontend version agreement and bump
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          python3 .github/scripts/check_version.py "origin/${{ github.base_ref }}"
        else
          python3 .github/scripts/check_version.py
        fi
  pytest:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Install Python 3.12 and dependencies
      run: |
        uv python install 3.12
        uv venv --clear --python 3.12 .venv
        uv pip install --python .venv/bin/python ".[dev,report]"
    - name: Run pytest
      run: |
        mkdir -p test-reports
        .venv/bin/pytest -v \
          --junit-xml=test-reports/junit.xml \
          --html=test-reports/report.html --self-contained-html \
          --excel-report=test-reports/report.ods
    - name: Upload junit.xml
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: backend/test-reports/junit.xml
        if-no-files-found: warn
        retention-days: 14
        archive: false
    - name: Upload report.html
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: backend/test-reports/report.html
        if-no-files-found: warn
        retention-days: 14
        archive: false
    - name: Upload report.ods
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: backend/test-reports/report.ods
        if-no-files-found: warn
        retention-days: 14
        archive: false
  deps-sync:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Check whether dependency files changed
      id: changed
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base="origin/${{ github.base_ref }}"
        elif [ "${{ github.event_name }}" = "push" ]; then
          base="${{ github.event.before }}"
        else
          echo "relevant=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if git diff --name-only "$base"...HEAD -- pyproject.toml requirements.txt uv.lock | grep -q .; then
          echo "relevant=true" >> "$GITHUB_OUTPUT"
        else
          echo "relevant=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Install uv
      if: steps.changed.outputs.relevant == 'true'
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Check uv.lock is up to date with pyproject.toml
      if: steps.changed.outputs.relevant == 'true'
      run: uv lock --check
    - name: Check requirements.txt matches pyproject.toml
      if: steps.changed.outputs.relevant == 'true'
      run: |
        cp requirements.txt requirements.txt.orig
        uv pip compile pyproject.toml -o requirements.txt
        diff requirements.txt.orig requirements.txt
  summary:
    needs:
    - version
    - pytest
    - compose-config
    - frontend
    - deps-sync
    if: always()
    runs-on: self-hosted
    outputs:
      failed: ${{ steps.failed.outputs.failed }}
    steps:
    - name: List the failed checks
      id: failed
      run: |
        failed=""
        for pair in "version=${{ needs.version.result }}" "pytest=${{ needs.pytest.result }}" \
                    "compose-config=${{ needs['compose-config'].result }}" \
                    "frontend=${{ needs.frontend.result }}" "deps-sync=${{ needs['deps-sync'].result }}"; do
          case "${pair#*=}" in failure|cancelled) failed="$failed ${pair%%=*}" ;; esac
        done
        echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        pattern: '*'
        path: test-reports
        merge-multiple: true
    - name: Publish combined CI summary
      run: |
        {
          echo "## CI summary"
          echo
          echo "| Check | Result |"
          echo "|---|---|"
          echo "| version | ${{ needs.version.result }} |"
          echo "| pytest | ${{ needs.pytest.result }} |"
          echo "| compose-config | ${{ needs['compose-config'].result }} |"
          echo "| frontend | ${{ needs.frontend.result }} |"
          echo "| deps-sync | ${{ needs['deps-sync'].result }} |"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Publish backend test detail
      run: python3 .github/scripts/junit_to_summary.py test-reports/junit.xml >> "$GITHUB_STEP_SUMMARY" || true
  compose-config:
    runs-on: self-hosted
    env:
      DOWNLOADS_DIR: /tmp/ci-placeholder-downloads
      REDIS_PASSWORD: ci-placeholder
      CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder
    steps:
    - uses: actions/checkout@v7
    - name: Check every required compose variable has a key in its .env template
      run: |
        python3 .github/scripts/check_required_env.py --env-file .env.example \
          --hint "Add each to .env.example (and the host's .env), see docs/RELEASE_PIPELINE.md, 'Adding a required env var'." \
          docker-compose.yml docker-compose.prod.yml
        python3 .github/scripts/check_required_env.py --env-file .env.dev.example \
          --hint "Add each to .env.dev.example, see docs/RELEASE_PIPELINE.md, 'Adding a required env var'." \
          docker-compose.yml docker-compose.override.yml
    - name: 'Create placeholder .env (file must exist for env_file: .env to resolve)'
      run: cp .env.example .env
    - name: Validate dev compose (base + override, the real local-dev invocation)
      run: docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet
    - name: Validate prod compose (base + prod overlay, the real deploy invocation)
      run: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile tunnel config --quiet
    - name: Validate nginx config syntax
      run: |
        docker run --rm \
          -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
          nginx:1.27-alpine nginx -t
  frontend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    env:
      PUBLIC_API_BASE_URL: ''
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Lint (prettier --check + eslint)
      run: npm run lint
    - name: Type-check (svelte-check)
      run: npm run check
    - name: Unit tests (vitest)
      run: npm run test:unit
    - name: Build
      run: npm run build
