# SCRATCH COPY for v49 verification; never merged.
name: Nightly (scratch)
'on':
  schedule:
  - cron: 17 4 * * *
  workflow_dispatch: null
jobs:
  yt-dlp-freshness:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v7
    - name: Build backend image
      run: docker build -t spotdl-web-yt-dlp-freshness-check ./backend
    - name: Compare built image's yt-dlp version against PyPI's latest
      id: yt-dlp
      continue-on-error: true
      run: |
        BUILT=$(docker run --rm spotdl-web-yt-dlp-freshness-check python -c "from importlib.metadata import version; print(version('yt-dlp'))")
        LATEST=$(curl -sf https://pypi.org/pypi/yt-dlp/json | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
        echo "Built image yt-dlp version: $BUILT"
        echo "PyPI latest yt-dlp version: $LATEST"
        if [ "$BUILT" != "$LATEST" ]; then
          echo "::error::Built image's yt-dlp ($BUILT) does not match PyPI's latest ($LATEST) -- backend/Dockerfile's float step may have failed at build time."
          exit 1
        fi
    - name: Compare built image's yt-dlp-ejs version against PyPI's latest
      id: yt-dlp-ejs
      continue-on-error: true
      run: |
        BUILT=$(docker run --rm spotdl-web-yt-dlp-freshness-check python -c "from importlib.metadata import version; print(version('yt-dlp-ejs'))")
        LATEST=$(curl -sf https://pypi.org/pypi/yt-dlp-ejs/json | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
        echo "Built image yt-dlp-ejs version: $BUILT"
        echo "PyPI latest yt-dlp-ejs version: $LATEST"
        if [ "$BUILT" != "$LATEST" ]; then
          echo "::error::Built image's yt-dlp-ejs ($BUILT) does not match PyPI's latest ($LATEST) -- backend/Dockerfile's float step may have failed at build time."
          exit 1
        fi
    - name: Fail if either version check failed
      if: steps.yt-dlp.outcome == 'failure' || steps.yt-dlp-ejs.outcome == 'failure'
      run: exit 1
  notify:
    needs:
    - yt-dlp-freshness
    runs-on: self-hosted
    if: always() && (needs.yt-dlp-freshness.result == 'failure' || needs.yt-dlp-freshness.result == 'cancelled')
    steps:
    - name: Send the Matrix notification
      env:
        MATRIX_HOMESERVER_URL: ${{ secrets.MATRIX_HOMESERVER_URL }}
        MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
        MATRIX_ROOM_ID: ${{ vars.SCRATCH_MATRIX_ROOM_ID }}
        MATRIX_TXN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        WORKFLOW: ${{ github.workflow }}
        RESULT: ${{ needs.yt-dlp-freshness.result }}
      run: |
        {
          echo "❌ spotdl-web: $WORKFLOW failed"
          echo "Failed job(s): yt-dlp-freshness ($RESULT)"
          echo "The backend image's yt-dlp or yt-dlp-ejs isn't PyPI's latest (or the check couldn't run): see the run."
          echo "Run: $RUN_URL"
        } > "$RUNNER_TEMP/message.txt"
        cat "$RUNNER_TEMP/message.txt"

        # Matrix sender, kept identical in nightly.yml, release-deploy.yml and publish-deploy.yml
        # (no checkout, so no shared script). PUT {homeserver}/_matrix/client/v3/rooms/{room}/
        # send/m.room.message/{txn}: the txn makes a retried request idempotent, and a re-run
        # (a new attempt) posts again, on purpose. Unconfigured (a secret empty) means alerts
        # are off, and a failed send is only a warning (v33.1): neither turns a run red. The URL
        # and the token reach curl on stdin (`--config -`), never its command line, and nothing
        # prints them; `-s` without `-S`, since curl's error text names the host. Cloudflare in
        # front of Synapse refuses a request without an explicit User-Agent (v33).
        if [ -z "$MATRIX_HOMESERVER_URL" ] || [ -z "$MATRIX_ACCESS_TOKEN" ] || [ -z "$MATRIX_ROOM_ID" ]; then
          echo "::warning::Matrix notification skipped: MATRIX_* not configured (repository secrets; see docs/DEPLOYMENT.md, 'Matrix alert bot')."
          exit 0
        fi
        room="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["MATRIX_ROOM_ID"].strip(), safe=""))')"
        python3 -c 'import json, sys; print(json.dumps({"msgtype": "m.text", "body": sys.stdin.read().strip()}))' \
          < "$RUNNER_TEMP/message.txt" > "$RUNNER_TEMP/matrix.json"
        code="$(printf 'url = "%s/_matrix/client/v3/rooms/%s/send/m.room.message/%s"\nheader = "Authorization: Bearer %s"\n' \
            "${MATRIX_HOMESERVER_URL%/}" "$room" "$MATRIX_TXN_ID" "$MATRIX_ACCESS_TOKEN" \
          | curl -s --config - -X PUT --max-time 30 \
              -H 'Content-Type: application/json' -A 'spotdl-web-pipeline/1 (+https://github.com/vb2007/spotdl-web)' \
              --data-binary "@$RUNNER_TEMP/matrix.json" -o "$RUNNER_TEMP/matrix.out" -w '%{http_code}')" || true
        case "$code" in
          2??) echo "Matrix notification sent (HTTP $code)" ;;
          ""|000) echo "::warning::Matrix notification failed: no response (connection error or timeout)" ;;
          # Matrix error bodies are {"errcode", "error"}: the errcode is safe and the only useful part.
          *) echo "::warning::Matrix notification failed: HTTP $code $(grep -o '"errcode": *"[A-Z_]*"' "$RUNNER_TEMP/matrix.out" | head -n1)" ;;
        esac
