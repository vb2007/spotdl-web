# Dev conveniences: bind-mounted source + hot reload. Applied automatically by
# `docker compose up` alongside docker-compose.yml; omit with `-f docker-compose.yml`
# for a prod-like run.
#
# v29: IPv6 on the project's default network, dev-only -- this file never applies in
# production (docker-compose.prod.yml's own header comment), so this has zero effect on
# the production Docker daemon until someone deliberately mirrors it there per
# docs/DEPLOYMENT.md's rollout section. Requires nothing beyond a per-network opt-in on
# Docker 27+ (confirmed against this host's Docker 29.8.0) -- no daemon.json change needed
# for a *user-defined* network's own IPv6 support, unlike the host-wide NAT question the
# production prerequisite check is actually about. Whether a given dev machine's own
# uplink can complete an IPv6 connection at all is a separate, environment-specific fact
# this compose config can't provide -- see docs/GOTCHAS.md's v29 entry.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:dead:beef::/64

# v32: the dev marker, on every backend service (api, migrate, all three workers, beat).
# app/config.py refuses to start a SPOTDL_ENV=dev process whose DATABASE_URL names the
# production database. Lives only in this file, which never applies in production, so
# production never carries it. `environment` is a mapping, so it merges by key with
# worker-meta's own RUN_DISK_RECONCILE/RUN_PROXY_SYNC/RUN_ALERT_WATCHDOG rather than replacing them.
x-dev-env: &dev-env
  SPOTDL_ENV: dev

# v52 (D2): the Celery workers restart on a backend edit, as `api` does under --reload.
# scripts/dev/reload.py runs the service's own `command` as its child and restarts it when a
# .py file under /app/app changes. It wraps through `entrypoint`, so each worker's `command`
# stays docker-compose.yml's, word for word (worker-dl's --concurrency=1
# --prefetch-multiplier=1 can't drift from production's), and a one-off `docker compose run`
# passes straight through it. `beat` isn't wrapped: restart it after editing its schedule.
# worker-dl and worker-expand give a running download or sweep their stop_grace_period (300 s)
# before a restart kills it, as `docker compose stop` would. `init: true` on each: the wrapper
# isn't PID 1 (which ignores a signal it has no handler for yet) and orphans get reaped.
x-dev-reload: &dev-reload ["python", "/opt/dev/reload.py", "--"]
x-dev-reload-long: &dev-reload-long ["python", "/opt/dev/reload.py", "--grace", "300", "--"]
x-dev-reload-mount: &dev-reload-mount ./scripts/dev:/opt/dev:ro

services:
  api:
    environment: *dev-env
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    # `command:` fully replaces rather than merges (same as `build:`, unlike list keys
    # such as `volumes:`/`ports:` — see CLAUDE.md's v01 gotcha) — the base file's
    # `--log-config logging.json` (v12) must be repeated here too, or dev silently loses
    # structured JSON logging entirely while prod keeps it.
    #
    # v32: settings are validated once *before* uvicorn starts. `--reload`'s supervisor
    # process never imports the app itself -- only its child does -- so when the child dies
    # on a config error (above all the production-database guard in app/config.py) the
    # supervisor keeps running and the container never exits. The pre-check makes a refused
    # config exit non-zero, same as every other backend service. `exec` keeps uvicorn at
    # PID 1 for signal handling.
    #
    # v52 (D1): `--timeout-graceful-shutdown`, or a reload hangs for as long as any
    # /api/stream is open. A reload shuts the old server down gracefully, and graceful means
    # waiting for every in-flight response to finish; an SSE response never does (it ends only
    # when its client hangs up), so `api` sat on "Waiting for connections to close" and answered
    # nothing. After 3 s uvicorn cancels what's left: the stream's own `finally` unsubscribes,
    # the browser's EventSource reconnects to the new server, and the app resyncs as on any
    # reconnect.
    command:
      [
        "sh",
        "-c",
        "python -c 'from app.config import get_settings; get_settings()' && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 3 --log-config logging.json",
      ]

  migrate:
    environment: *dev-env
    # Same bind-mount convenience as `api` below -- a new local Alembic revision file is
    # picked up on the next `docker compose up` without needing `--build` first.
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  worker-dl:
    environment: *dev-env
    entrypoint: *dev-reload-long
    init: true
    # Bind-mounted to the project root instead of the base file's named `downloads` volume,
    # so downloaded files are directly browsable on the host during local dev. `!override`
    # replaces rather than merges (v01 gotcha) — without it this would sit alongside the
    # named volume as a second, conflicting mount at the same target.
    volumes: !override
      - ./backend/app:/app/app
      - *dev-reload-mount
      - ./downloads:/downloads
      # v38: the dedup gate must see moved files; read-only, as in the base file.
      - ./test-library:/mnt/raid1/media/music:ro

  worker-meta:
    environment: *dev-env
    entrypoint: *dev-reload
    init: true
    volumes: !override
      - ./backend/app:/app/app
      - *dev-reload-mount
      - ./downloads:/downloads
      - ./proxies.txt:/app/proxies.txt:ro
      # v28: a throwaway local test library, never the real ~120k-track directory --
      # see docs/GOTCHAS.md's v28 entry and plan/master-v3/v28-library-sort-move.md's
      # "Done when" ("verified against a copy of the library structure, never the live
      # 120k directory on the first run"). Gitignored, same as ./downloads.
      - ./test-library:/mnt/raid1/media/music

  worker-expand:
    environment: *dev-env
    entrypoint: *dev-reload-long
    init: true
    volumes: !override
      - ./backend/app:/app/app
      - *dev-reload-mount
      - ./downloads:/downloads
      - ./test-library:/mnt/raid1/media/music

  beat:
    environment: *dev-env
    volumes:
      - ./backend/app:/app/app

  web:
    build:
      context: ./frontend
      # v52: the dependencies-only dev stage, running as `node` (uid 1000), so what Vite writes
      # into the bind mount isn't root's (D3).
      target: dev
    # v52 (D4): node_modules lives in a volume, which outlives an image rebuild, so a changed
    # package-lock.json used to need `up -d --renew-anon-volumes`. The volume carries a stamp
    # of the lockfile it was installed from (frontend/Dockerfile's dev stage); when the
    # bind-mounted lockfile no longer matches it, `npm ci` reinstalls into the volume before
    # Vite starts. A restart (`docker compose restart web`) is all a dependency change needs.
    # The stamp leaves out the app's own version (frontend/scripts/lockfile-stamp.mjs), so a
    # version bump alone never reinstalls.
    # What a dev `web` from before v52 (root, the `build` stage) left behind would fail Vite with
    # EACCES halfway through, so it exits here instead, saying what to do (and Docker's restart
    # policy keeps re-running the check until it's done): its image (the first `up` after v52
    # needs `--build`), volumes it filled as root, or root-owned files on the bind mount.
    command:
      - sh
      - -c
      - |
        if [ "$$(id -u)" = 0 ]; then
          echo "web: this is the dev web image from before v52 (it runs as root), and Docker has filled web's volumes from it as root." >&2
          echo "web: once (docker compose ls names the project):" >&2
          echo "  docker compose rm -sf web && docker volume rm <project>_web-node-modules <project>_web-paraglide <project>_web-svelte-kit && docker compose up -d --build web" >&2
          exit 1
        fi
        for dir in node_modules src/lib/paraglide .svelte-kit; do
          if [ ! -w "$$dir" ]; then
            echo "web: $$dir isn't writable by uid $$(id -u): a dev web image from before v52 filled its volume as root." >&2
            echo "web: remove the web container and its three volumes once (docker compose ls names the project), then start web again:" >&2
            echo "  docker compose rm -sf web && docker volume rm <project>_web-node-modules <project>_web-paraglide <project>_web-svelte-kit" >&2
            exit 1
          fi
        done
        stale="$$(find /app \( -path /app/node_modules -o -path /app/src/lib/paraglide -o -path /app/.svelte-kit \) -prune -o -user 0 -print | head -3)"
        if [ -n "$$stale" ]; then
          echo "web: root-owned files in frontend/, left by a dev web container from before v52:" >&2
          echo "$$stale" >&2
          echo "web: hand them back once (in an agent slot, prefix it with scripts/agent_stack.sh <slot> run, or just run scripts/agent_stack.sh <slot> up), then start web again:" >&2
          echo "  docker compose run --rm --no-deps -u root web sh -c 'find /app \\( -path /app/node_modules -o -path /app/src/lib/paraglide -o -path /app/.svelte-kit \\) -prune -o -user 0 -exec chown 1000:1000 {} +'" >&2
          exit 1
        fi
        want="$$(node scripts/lockfile-stamp.mjs)"
        if [ "$$(cat node_modules/.package-lock.sha256 2>/dev/null)" != "$$want" ]; then
          echo "web: package-lock.json changed since node_modules was installed; running npm ci"
          npm ci --no-audit --no-fund || exit 1
          echo "$$want" > node_modules/.package-lock.sha256
        fi
        exec npm run dev -- --host 0.0.0.0 --port 5173
    # `!override` here, not a plain merge (v27) -- without it, this list would sit alongside
    # the base file's `downloads:/downloads:ro` *named volume*, which is a second, empty,
    # Docker-managed volume, never the real host directory worker-dl/worker-meta actually
    # write into (those two `!override` their own `volumes:` to the real `./downloads` bind
    # mount below, same as this one). Vite's own dev-proxy fallback (vite.config.ts) needs
    # this container looking at the *same* real files, or it 404s trying to read a
    # perpetually-empty volume that isn't the one anything ever downloads into.
    volumes: !override
      - ./frontend:/app
      # v52: named, not anonymous (v46). A new name starts from the dev image's content, owned
      # by `node`; the anonymous ones a pre-v52 container left behind are root-owned and would
      # otherwise be carried into the recreated container.
      - web-node-modules:/app/node_modules
      # v46: Paraglide's compiled messages (src/lib/paraglide) get the container's own copy, as
      # node_modules does, so a host-side `npm run check`/`lint` and the container never fight
      # over one compiled output.
      - web-paraglide:/app/src/lib/paraglide
      # v52 (D7): and SvelteKit's generated files. On the shared bind mount a host-side
      # `npm run check`/`build` (`svelte-kit sync`) rewrote the very files this Vite serves, and
      # Vite answered with a full reload of every open page: mid-suite, spec 1 failed on it.
      # Each side now generates its own.
      - web-svelte-kit:/app/.svelte-kit
      - ./downloads:/downloads:ro
      - ./test-library:/mnt/raid1/media/music:ro
    # `ports` lists merge across compose files rather than replace (unlike `command`/`build`
    # above) — without `!override`, this would ADD to docker-compose.yml's `5173:80` mapping
    # instead of replacing it, leaving two host bindings on the same 127.0.0.1:5173 and a
    # "port is already allocated" error at container start.
    # v50: the host side follows WEB_PORT (an agent slot's 5174-5177); the container side
    # stays Vite's 5173.
    ports: !override
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    healthcheck:
      # The base file's healthcheck targets nginx on :80 (the prod image) -- dev runs
      # Vite on :5173 instead (see `command`/`ports` above), so it needs its own target
      # here or every dev `web` container reports permanently unhealthy.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      # v52: room for the `npm ci` a changed lockfile runs first.
      start_period: 300s

# v52: the dev `web` container's own node_modules, compiled messages and SvelteKit output (see
# its `volumes`).
volumes:
  web-node-modules:
  web-paraglide:
  web-svelte-kit:
