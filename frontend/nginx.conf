# Same-origin reverse proxy for the `web` container (v12). Serves the prerendered
# SvelteKit static build and proxies /api/* to the `api` compose service, so the browser
# only ever talks to one origin — no CORS in production, plain first-party session cookie.
# Replaces nginx:alpine's stock /etc/nginx/conf.d/default.conf entirely (see
# frontend/Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS resolver. proxy_pass below resolves `api` through a variable
    # rather than a bare literal specifically so this resolution happens at *request* time,
    # re-checked every 10s, instead of once at nginx startup: a literal `proxy_pass
    # http://api:8000;` gets resolved and cached for the worker process's entire lifetime,
    # which both (a) crashes nginx at boot if `api` isn't resolvable yet — a real race, since
    # compose starts services concurrently — and (b) keeps proxying to `api`'s *old* IP
    # forever after `docker compose up -d --build` recreates that container. Neither
    # failure is hypothetical; both were caught before this ever shipped.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000$request_uri;

        # Default proxy_http_version is 1.0, which has no chunked transfer encoding and no
        # keepalive — breaks streaming responses (SSE) and is generally wasteful. Must be
        # paired with clearing the implicit `Connection: close` header 1.0 would otherwise
        # carry, or upstream keepalive still doesn't happen.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE (`GET /api/stream`): the backend already sends `X-Accel-Buffering: no` on that
        # response, which nginx honors and disables buffering for specifically — these two
        # directives are belt-and-suspenders for every other /api/ response and for older
        # nginx builds that might not respect the header. The long timeouts protect the
        # long-lived stream connection; the backend's 15s heartbeat keeps it well inside
        # either value regardless.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # cloudflared terminates TLS in front of this container; $scheme here is always
        # "http" even though the public-facing request was https.
        proxy_set_header X-Forwarded-Proto https;
    }

    # /api/health is the container's own healthcheck target (see docker-compose.yml) and
    # exposes raw Postgres/Redis reachability — no reason for that to be reachable from the
    # public internet through the tunnel. This location is matched (exact match) ahead of
    # the /api/ prefix location regardless of file order.
    location = /api/health {
        return 404;
    }

    # Content-hashed build output — safe to cache forever. A single explicit
    # Cache-Control header rather than `expires 1y;` + `add_header` together — nginx's
    # `expires` directive sets its own Cache-Control (`max-age=...`) independently of
    # add_header, and the two don't merge: pairing them sends two separate Cache-Control
    # response headers, which some HTTP clients/proxies handle inconsistently.
    location /_app/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Three routes exist in this app (frontend/src/routes/: /, /login, /settings), all
    # prerendered (`+layout.ts` forces prerender=true) to real .html files at build time —
    # `login.html`, not a route nginx can serve for a request to the extensionless path
    # `/login`. This is handled per known route explicitly rather than with a wildcard
    # SPA-shell fallback (`try_files $uri /index.html`): a wildcard fallback would silently
    # return 200 + HTML for a genuinely missing asset chunk or an actually-bad path too,
    # which is worse than a real 404 (a mistyped asset URL becomes a confusing "Unexpected
    # token '<'" JS error instead of an honest failed request). Any future route added to
    # this app needs its own location block here, matching the .html filename
    # @sveltejs/adapter-static emits.
    location = / {
        try_files /index.html =404;
    }

    location = /login {
        try_files /login.html =404;
    }

    location = /settings {
        try_files /settings.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
